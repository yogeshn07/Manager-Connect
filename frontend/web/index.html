<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manager Connect — Leadership community platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manager Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Manager Connect</title>
  <link rel="manifest" href="manifest.json">

  <!-- REM-04: Preload hints for critical resources -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="flutter.js" as="script">

  <!-- Passkeys Web SDK stub — supabase_flutter transitive dependency -->
  <script>
    var PasskeyAuthenticator = {
      init: function() { return Promise.resolve(); },
      register: function() { return Promise.reject('Passkeys not configured'); },
      login: function() { return Promise.reject('Passkeys not configured'); },
      cancelCurrentAuthenticatorOperation: function() {},
      isUserVerifyingPlatformAuthenticatorAvailable: function() { return Promise.resolve(false); },
      isConditionalMediationAvailable: function() { return Promise.resolve(false); },
      hasPasskeySupport: function() { return Promise.resolve(false); }
    };
  </script>

  <!-- REM-04: Loading indicator shown immediately while Flutter initializes -->
  <style>
    body { margin: 0; background: #F4F5F7; }
    #mc-loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    }
    #mc-loading .mc-gem {
      width: 48px;
      height: 48px;
      background: #085041;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    #mc-loading .mc-gem svg {
      width: 24px;
      height: 24px;
      fill: white;
    }
    #mc-loading .mc-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #D3D1C7;
      border-top-color: #0C447C;
      border-radius: 50%;
      animation: mc-spin 0.8s linear infinite;
      margin-bottom: 14px;
    }
    #mc-loading .mc-text {
      font-size: 13px;
      font-weight: 400;
      color: #5F5E5A;
    }
    @keyframes mc-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- REM-04: Visible loading indicator — Flutter removes this div when app renders -->
  <div id="mc-loading">
    <div class="mc-gem">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <div class="mc-spinner"></div>
    <div class="mc-text">Loading Manager Connect...</div>
  </div>

  <!-- REM-07: Clean auth callback ?code= parameter after Supabase processes it -->
  <script>
    (function() {
      var url = new URL(window.location.href);
      if (url.searchParams.has('code')) {
        // Delay cleanup so Supabase SDK can read the code first
        setTimeout(function() {
          url.searchParams.delete('code');
          window.history.replaceState(null, '', url.pathname + url.hash);
        }, 2000);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
